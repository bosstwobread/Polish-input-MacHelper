    <text x="174.0" y="94" font-size="15" fill="#7a7186" data-preview-key="polish.editorTitle" data-preview-width="830" direction="ltr" text-anchor="start" unicode-bidi="plaintext"><tspan x="174.0" dy="0">동료에게 보내는 메모</tspan></text>
    <rect x="96" y="148" width="904" height="99" rx="10" fill="#fff" stroke="#d7d1e1" />
