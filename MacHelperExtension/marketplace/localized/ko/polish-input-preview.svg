    <text x="803.0" y="680" font-size="11" fill="#91849c" data-preview-key="translation.previewLabel" data-preview-width="290" direction="ltr" text-anchor="start" unicode-bidi="plaintext"><tspan x="803.0" dy="0">화면 미리 보기 · 예시 내용</tspan></text>
